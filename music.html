<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simple Music Player</title>

<style>
  /* ===== Basic page styling ===== */
  body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #222831;
    font-family: Arial, sans-serif;
    color: #ffffff;
  }

  /* ===== Player box ===== */
  .player {
    background-color: #393e46;
    border-radius: 12px;
    padding: 20px;
    width: 300px;
    text-align: center;
  }

  h2 {
    margin-top: 0;
  }

  /* ===== Song info text ===== */
  #songTitle {
    margin: 10px 0 2px 0;
    font-size: 18px;
  }

  #songArtist {
    margin: 0 0 15px 0;
    font-size: 14px;
    color: #cccccc;
  }

  /* ===== Progress bar ===== */
  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 5px;
  }

  #progressBarContainer {
    width: 100%;
    height: 10px;
    background-color: #555;
    border-radius: 5px;
    cursor: pointer;
    margin-bottom: 15px;
  }

  #progressBar {
    width: 0%;
    height: 100%;
    background-color: #00adb5;
    border-radius: 5px;
  }

  /* ===== Buttons ===== */
  .controls {
    margin-bottom: 15px;
  }

  .controls button {
    background-color: #00adb5;
    border: none;
    color: white;
    font-size: 16px;
    padding: 10px 15px;
    margin: 0 5px;
    border-radius: 5px;
    cursor: pointer;
  }

  .controls button:hover {
    background-color: #019aa1;
  }

  /* ===== Volume control ===== */
  .volume-row {
    margin-bottom: 15px;
  }

  .volume-row input {
    width: 80%;
  }

  /* ===== Playlist ===== */
  #playlist {
    list-style: none;
    padding: 0;
    text-align: left;
  }

  #playlist li {
    padding: 8px;
    border-radius: 5px;
    cursor: pointer;
    margin-bottom: 5px;
    background-color: #4b515a;
  }

  #playlist li:hover {
    background-color: #5a616c;
  }

  /* Highlight the song that is currently playing */
  #playlist li.active {
    background-color: #00adb5;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="player">

  <h2>Music Player</h2>

  <!-- Song title and artist name are shown here -->
  <p id="songTitle">Song Title</p>
  <p id="songArtist">Artist Name</p>

  <!-- Current time and total duration -->
  <div class="time-row">
    <span id="currentTime">0:00</span>
    <span id="duration">0:00</span>
  </div>

  <!-- Progress bar. Clicking on it will seek the song -->
  <div id="progressBarContainer">
    <div id="progressBar"></div>
  </div>

  <!-- Play, Pause, Next, Previous buttons -->
  <div class="controls">
    <button id="prevBtn">Prev</button>
    <button id="playBtn">Play</button>
    <button id="nextBtn">Next</button>
  </div>

  <!-- Volume slider -->
  <div class="volume-row">
    <label for="volumeSlider">Volume: </label>
    <input type="range" id="volumeSlider" min="0" max="100" value="80" />
  </div>

  <!-- Playlist with 3 sample songs -->
  <ul id="playlist"></ul>

</div>

<!-- This is the actual audio player. It stays hidden, JavaScript controls it -->
<audio id="audio"></audio>

<script>
  /* ==========================================================
     STEP 1: Create a list (array) of songs.
     Each song is an object with title, artist and file path.
     To use your own local MP3 files, put them in a folder
     named "songs" next to this index.html file, and change
     the "src" values below to match your file names.
     ========================================================== */
  var songs = [
    {
      title: "Song One",
      artist: "Artist One",
      src: "songs/song1.mp3"
    },
    {
      title: "Song Two",
      artist: "Artist Two",
      src: "songs/song2.mp3"
    },
    {
      title: "Song Three",
      artist: "Artist Three",
      src: "songs/song3.mp3"
    }
  ];

  /* ==========================================================
     STEP 2: Get all the HTML elements we need to control.
     ========================================================== */
  var audio = document.getElementById("audio");
  var songTitle = document.getElementById("songTitle");
  var songArtist = document.getElementById("songArtist");

  var playBtn = document.getElementById("playBtn");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");

  var progressBarContainer = document.getElementById("progressBarContainer");
  var progressBar = document.getElementById("progressBar");
  var currentTimeText = document.getElementById("currentTime");
  var durationText = document.getElementById("duration");

  var volumeSlider = document.getElementById("volumeSlider");
  var playlistElement = document.getElementById("playlist");

  /* ==========================================================
     STEP 3: Variables to keep track of the current state.
     ========================================================== */
  var currentSongIndex = 0;   // which song is currently loaded
  var isPlaying = false;      // is the song playing right now?

  /* ==========================================================
     STEP 4: Function to load a song into the audio player
     and update the title/artist text on screen.
     ========================================================== */
  function loadSong(index) {
    var song = songs[index];
    audio.src = song.src;
    songTitle.textContent = song.title;
    songArtist.textContent = song.artist;
    highlightActiveSong();
  }

  /* ==========================================================
     STEP 5: Function to play the song.
     ========================================================== */
  function playSong() {
    isPlaying = true;
    playBtn.textContent = "Pause";
    audio.play();
  }

  /* ==========================================================
     STEP 6: Function to pause the song.
     ========================================================== */
  function pauseSong() {
    isPlaying = false;
    playBtn.textContent = "Play";
    audio.pause();
  }

  /* ==========================================================
     STEP 7: Play button click event.
     If song is playing, pause it. If paused, play it.
     ========================================================== */
  playBtn.addEventListener("click", function () {
    if (isPlaying) {
      pauseSong();
    } else {
      playSong();
    }
  });

  /* ==========================================================
     STEP 8: Next button - go to next song in the list.
     ========================================================== */
  function nextSong() {
    currentSongIndex = currentSongIndex + 1;

    // If we went past the last song, go back to the first song
    if (currentSongIndex >= songs.length) {
      currentSongIndex = 0;
    }

    loadSong(currentSongIndex);
    playSong();
  }
  nextBtn.addEventListener("click", nextSong);

  /* ==========================================================
     STEP 9: Previous button - go to previous song in the list.
     ========================================================== */
  function prevSong() {
    currentSongIndex = currentSongIndex - 1;

    // If we went before the first song, go to the last song
    if (currentSongIndex < 0) {
      currentSongIndex = songs.length - 1;
    }

    loadSong(currentSongIndex);
    playSong();
  }
  prevBtn.addEventListener("click", prevSong);

  /* ==========================================================
     STEP 10: Update the progress bar while the song plays.
     The "timeupdate" event fires automatically many times
     per second while audio is playing.
     ========================================================== */
  audio.addEventListener("timeupdate", function () {
    var currentTime = audio.currentTime;
    var duration = audio.duration;

    // Only update if we know the duration (avoids errors on load)
    if (duration) {
      var progressPercent = (currentTime / duration) * 100;
      progressBar.style.width = progressPercent + "%";

      currentTimeText.textContent = formatTime(currentTime);
      durationText.textContent = formatTime(duration);
    }
  });

  /* ==========================================================
     STEP 11: Helper function to change seconds into
     a "minutes:seconds" format, like 1:05
     ========================================================== */
  function formatTime(seconds) {
    var minutes = Math.floor(seconds / 60);
    var remainingSeconds = Math.floor(seconds % 60);

    // Add a leading zero if seconds is less than 10 (example: 1:05 not 1:5)
    if (remainingSeconds < 10) {
      remainingSeconds = "0" + remainingSeconds;
    }

    return minutes + ":" + remainingSeconds;
  }

  /* ==========================================================
     STEP 12: Let the user click on the progress bar to
     jump to a different part of the song (seeking).
     ========================================================== */
  progressBarContainer.addEventListener("click", function (event) {
    var barWidth = progressBarContainer.clientWidth;
    var clickPosition = event.offsetX;
    var duration = audio.duration;

    if (duration) {
      audio.currentTime = (clickPosition / barWidth) * duration;
    }
  });

  /* ==========================================================
     STEP 13: Volume slider control.
     Slider value goes from 0 to 100, but audio.volume needs
     a number between 0 and 1, so we divide by 100.
     ========================================================== */
  volumeSlider.addEventListener("input", function () {
    audio.volume = volumeSlider.value / 100;
  });

  /* ==========================================================
     STEP 14: Autoplay the next song when the current song ends.
     The "ended" event fires automatically when playback finishes.
     ========================================================== */
  audio.addEventListener("ended", function () {
    nextSong();
  });

  /* ==========================================================
     STEP 15: Build the playlist list on the screen.
     Clicking a song in the list plays that song.
     ========================================================== */
  function buildPlaylist() {
    playlistElement.innerHTML = ""; // clear old list first

    for (var i = 0; i < songs.length; i++) {
      var listItem = document.createElement("li");
      listItem.textContent = songs[i].title + " - " + songs[i].artist;

      // Use a separate function to "lock in" the correct index for each song
      listItem.addEventListener("click", (function (songIndex) {
        return function () {
          currentSongIndex = songIndex;
          loadSong(currentSongIndex);
          playSong();
        };
      })(i));

      playlistElement.appendChild(listItem);
    }
  }

  /* ==========================================================
     STEP 16: Highlight the song that is currently playing
     inside the playlist.
     ========================================================== */
  function highlightActiveSong() {
    var allItems = playlistElement.querySelectorAll("li");
    for (var i = 0; i < allItems.length; i++) {
      if (i === currentSongIndex) {
        allItems[i].classList.add("active");
      } else {
        allItems[i].classList.remove("active");
      }
    }
  }

  /* ==========================================================
     STEP 17: Run this code once when the page first loads.
     ========================================================== */
  buildPlaylist();
  loadSong(currentSongIndex);
  audio.volume = volumeSlider.value / 100;

</script>

</body>
</html>
